name: Build and test

on:
  push:
    branches: [devel]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install ffmpeg and mkvtoolnix (test fixtures only)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg mkvtoolnix ;;
            macOS)   brew install ffmpeg mkvtoolnix ;;
            Windows) choco install -y ffmpeg mkvtoolnix && echo "C:\Program Files\MKVToolNix" >> $GITHUB_PATH ;;
          esac

      # Provider API keys compiled into the binaries (see src/MMW.Metadata/BundledApiKeys.targets). Only the build step
      # sees them, so tests are not affected; they are empty on pull requests from forks, which still build fine.
      - name: Build
        run: dotnet build MediaMuxingWizard.slnx -c Release
        env:
          MMW_TMDB_API_KEY: ${{ secrets.MMW_TMDB_API_KEY }}
          MMW_TVDB_API_KEY: ${{ secrets.MMW_TVDB_API_KEY }}
          MMW_FANARTTV_API_KEY: ${{ secrets.MMW_FANARTTV_API_KEY }}

      - name: Test
        run: dotnet test --solution MediaMuxingWizard.slnx -c Release --no-build
